<style>
:root{

}
@media (prefers-color-scheme: dark){

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
header{padding:22px 28px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font-size:19px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12.5px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:400px minmax(0,1fr);gap:18px;padding:18px 28px 40px;max-width:1500px;margin:0 auto}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.searchbox{padding:14px;border-bottom:1px solid var(--line)}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:13px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.count{padding:9px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
.list{overflow:auto;max-height:calc(100vh - 210px)}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 14px;cursor:pointer}
.item:hover{background:var(--accent-soft)}
.item.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.item .path{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.item .purpose{display:-webkit-box;color:var(--muted);font-size:11.5px;line-height:1.45;margin-top:3px;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .meta{display:flex;gap:6px;align-items:center;margin-bottom:3px;flex-wrap:wrap}
.method{font:600 10.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;border-radius:5px;padding:1px 6px;background:var(--code);color:var(--muted)}
.m-get{color:#0b6bcb}.m-post{color:#0f766e}.m-put{color:#a16207}.m-delete{color:#b42318}.m-any{color:#6d28d9}
.svc{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
main{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:24px 26px;min-height:540px}
.detail-head h2{margin:0 0 8px;font-size:17px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;line-height:1.4}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.purpose{margin:0 0 20px;color:var(--muted);font-size:13px}
.timeline{position:relative;margin:0;padding:0 0 0 26px;list-style:none}
.timeline:before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--line)}
.step{position:relative;padding:0 0 18px 8px}
.step:last-child{padding-bottom:0}
.num{position:absolute;left:-25px;top:1px;width:20px;height:20px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);color:var(--accent);font:600 10px/16px ui-monospace,monospace;text-align:center}
.module{display:inline-block;font:600 10.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border-radius:5px;padding:1px 7px;margin-right:7px;background:var(--accent-soft);color:var(--accent)}
.action{font-weight:600}
.detail{color:var(--muted);font-size:12.5px;margin:3px 0 0}
.sources{margin:5px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.sources a{font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent);text-decoration:none;background:var(--code);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.sources a:hover{text-decoration:underline}
.note{margin-top:22px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);padding:30px 4px}
@media (max-width:900px){.layout{grid-template-columns:1fr;padding:14px}.list{max-height:320px}main{padding:18px}}
</style>
</head>

"steps": [{"module": "Client", "action": "HTTP/WebSocket", "detail": ""}, {"module": "Gateway", "action": "chat proxy", "detail": "上游 astral-chat 已排除 workspace"}, {"module": "Chat upstream", "action": "方法由上游决定", "detail": ""}]}, {"service": "Gateway", "group": "chat", "methods": ["ANY"], "path": "/v1/chat/groups", "purpose": "群组列表", "steps": [{"module": "Client", "action": "HTTP/WebSocket", "detail": ""}, {"module": "Gateway", "action": "chat proxy", "detail": "上游 astral-chat 已排除 workspace"}, {"module": "Chat upstream", "action": "方法由上游决定", "detail": ""}]}, {"service": "Gateway", "group": "chat", "methods": ["ANY"], "path": "/v1/chat/groups/{id}", "purpose": "群组详情", "steps": [{"module": "Client", "action": "HTTP/WebSocket", "detail": ""}, {"module": "Gateway", "action": "chat proxy", "detail": "上游 astral-chat 已排除 workspace"}, {"module": "Chat upstream", "action": "方法由上游决定", "detail": ""}]}, {"service": "Gateway", "group": "chat", "methods": ["ANY"], "path": "/v1/chat/groups/{id}/members", "purpose": "群组成员", "steps": [{"module": "Client", "action": "HTTP/WebSocket", "detail": ""}, {"module": "Gateway", "action": "chat proxy", "detail": "上游 astral-chat 已排除 workspace"}, {"module": "Chat upstream", "action": "方法由上游决定", "detail": ""}]}, {"service": "Gateway", "group": "chat", "methods": ["ANY"], "path": "/v1/chat/groups/{id}/members/{user_id}", "purpose": "移除成员", "steps": [{"module": "Client", "action": "HTTP/WebSocket", "detail": ""}, {"module": "Gateway", "action": "chat proxy", "detail": "上游 astral-chat 已排除 workspace"}, {"module": "Chat upstream", "action": "方法由上游决定", "detail": ""}]}, {"service": "Gateway", "group": "chat", "methods": ["ANY"], "path": "/v1/chat/groups/{id}/transfer-owner", "purpose": "转移群主", "steps": [{"module": "Client", "action": "HTTP/WebSocket", "detail": ""}, {"module": "Gateway", "action": "chat proxy", "detail": "上游 astral-chat 已排除 workspace"}, {"module": "Chat upstream", "action": "方法由上游决定", "detail": ""}]}, {"service": "Gateway", "group": "ch n 已排除 workspace"}, {"module": "Learn upstream", "action": "方法由上游决定", "detail": ""}]}, {"service": "Gateway", "group": "observability", "methods": ["GET"], "path": "/metrics", "purpose": "Prometheus 监听 127.0.0.1:9100", "steps": [{"module": "Ops network", "action": "Gateway metrics listener", "detail": "127.0.0.1:9100"}, {"module": "Gateway", "action": "Prometheus handler", "detail": ""}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('trace-data').textContent);
const ITEMS = DATA.endpoints;
const REPO = 'https://github.com/CoreryBlack/AstralLight.Next/blob/' + DATA.baseline;
const state = { query: '', filtered: [], active: -1 };

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
const methodClass = m => m === 'GET' ? 'm-get' : m === 'POST' ? 'm-post' : m === 'PUT' ? 'm-put' : m === 'DELETE' ? 'm-delete' : 'm-any';
const methodLabel = entry => entry.methods.join(' / ');
const keyOf = entry => methodLabel(entry) + ' ' + entry.path;

function stats(){
  const box = document.getElementById('stats');
  const total = ITEMS.length;
  const services = [...new Set(ITEMS.map(i => i.service))];
  box.append(el('span','pill', total + ' endpoints'));
  services.forEach(s => {
    const n = ITEMS.filter(i => i.service === s).length;
    box.append(el('span','pill', s + ' ' + n));
  });
}

function filtered(){
  const q = state.query.trim().toLowerCase();
  if (!q) return ITEMS;
  return ITEMS.filter(i => (keyOf(i) + ' ' + i.service + ' ' + i.group + ' ' + (i.purpose || '')).toLowerCase().includes(q));
}

function renderList(){
  state.filtered = filtered();
  const list = document.getElementById('list');
  list.replaceChildren();
  document.getElementById('count').textContent = state.filtered.length + ' / ' + ITEMS.length + ' 条';
  if (!state.filtered.length){ list.append(el('div','empty','没有匹配的接口。试试 /tenants、PolicyEngine 或 POST。')); return; }
  state.filtered.forEach((entry, index) => {
    const button = el('button','item' + (index === state.active ? ' active' : ''));
    button.type = 'button';
    const meta = el('span','meta');
    meta.append(el('span','method ' + methodClass(entry.methods[0]), methodLabel(entry)));
    meta.append(el('span','svc', entry.service));
    button.append(meta, el('span','path', entry.path));
    if (entry.purpose) button.append(el('span','purpose', entry.purpose.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')));
    button.addEventListener('click', () => select(index));
    list.append(button);
  });
}

function sourceLink(source){
  const a = el('a', '', source.path.split('/').pop() + ':' + source.line + '-' + source.end_line);
  a.href = REPO + '/' + source.path + '#L' + source.line + '-L' + source.end_line;
  a.target = '_blank'; a.rel = 'noreferrer';
  a.title = source.path + ':' + source.line + '-' + source.end_line;
  return a;
}

function renderDetail(entry){
  const detail = document.getElementById('detail');
  detail.replaceChildren();
  if (!entry){ detail.append(el('div','empty','未选择接口。')); return; }
  const head = el('div','detail-head');
  head.append(el('h2','', methodLabel(entry) + ' ' + entry.path));
  const meta = el('div','detail-meta');
  meta.append(el('span','method ' + methodClass(entry.methods[0]), methodLabel(entry)));
  meta.append(el('span','svc', entry.service));
  meta.append(el('span','svc', '/' + entry.group));
  head.append(meta);
  if (entry.purpose) head.append(el('p','purpose', '作用：' + entry.purpose.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')));
  detail.append(head);

  const list = el('ol','timeline');
  entry.steps.forEach((step, index) => {
    const li = el('li','step');
    li.append(el('span','num', String(index + 1)));
    const body = el('div','step-body');
    const line = el('div');
    line.append(el('span','module', step.module));
    line.append(el('span','action', step.action));
    body.append(line);
    if (step.detail) body.append(el('p','detail', step.detail));
    if (step.sources && step.sources.length){
      const sources = el('ul','sources');
      step.sources.forEach(s => { const item = el('li'); item.append(sourceLink(s)); sources.append(item); });
      body.append(sources);
    }
    li.append(body);
    list.append(li);
  });
  detail.append(list);
  detail.append(el('div','note','链路来自路由注册、中间件与模块边界的契约模型；handler 内部调用需按源码位置继续追踪。'));
}

function select(index, updateHash = true){
  if (index < 0 || index >= state.filtered.length) return;
  state.active = index;
  renderList();
  renderDetail(state.filtered[index]);
  if (updateHash) history.replaceState(null, '', '#' + encodeURIComponent(keyOf(state.filtered[index])));
  const list = document.getElementById('list');
  const active = list.querySelector('.item.active');
  if (active) active.scrollIntoView({block:'nearest'});
}

function initial(){
  stats();
  const hash = decodeURIComponent(location.hash.slice(1));
  const preferred = ITEMS.find(i => i.path.includes('/integrations/authorization-decisions')) || ITEMS[0];
  state.filtered = ITEMS;
  const index = hash ? ITEMS.findIndex(i => keyOf(i) === hash) : ITEMS.indexOf(preferred);
  state.active = index >= 0 ? index : 0;
  renderList();
  renderDetail(ITEMS[state.active]);
  const listEl = document.getElementById('list');
  const active = listEl.querySelector('.item.active');
  if (active) listEl.scrollTop = Math.max(0, active.offsetTop - listEl.offsetTop - listEl.clientHeight / 2 + active.clientHeight / 2);
  if (!hash) history.replaceState(null, '', '#' + encodeURIComponent(keyOf(ITEMS[state.active])));
  if (hash && index < 0) document.getElementById('search').value = hash;
}

document.getElementById('search').addEventListener('input', e => {
  state.query = e.target.value;
  state.active = 0;
  renderList();
  if (state.filtered.length) select(0, false);
  else renderDetail(null);
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== document.getElementById('search')){
    e.preventDefault(); document.getElementById('search').focus();
  }
  if (e.key === 'Escape'){ const s = document.getElementById('search'); s.value = ''; s.blur(); state.query = ''; state.active = 0; renderList(); if (state.filtered.length) select(0, false); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if (!state.filtered.length) return;
    e.preventDefault();
    const next = (state.active + (e.key === 'ArrowDown' ? 1 : -1) + state.filtered.length) % state.filtered.length;
    select(next);
  }
});
window.addEventListener('hashchange', () => {
  const hash = decodeURIComponent(location.hash.slice(1));
  const index = state.filtered.findIndex(i => keyOf(i) === hash);
  if (index >= 0) select(index, false);
});
initial();
</script>
