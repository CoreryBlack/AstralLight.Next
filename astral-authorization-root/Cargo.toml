[package]
name = "astral-authorization-root"
version = "0.1.0"
edition = "2021"
license = { workspace = true }
publish = false

[dependencies]
astral-types = { path = "../astral-types" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
im = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }
uuid = { workspace = true }

[features]
# memory—v1: Isolated-test hooks only (for example adopting a fixture root as
# Serving). Enable it exclusively from `[dev-dependencies]`; with resolver 2 it
# is then absent from every non-test build, including production binaries.
test-support = []

[[bench]]
name = "memory_v1_candidate"
harness = false
