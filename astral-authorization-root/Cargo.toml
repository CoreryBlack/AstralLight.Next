[package]
name = "astral-authorization-root"
version = "0.1.0"
edition = "2021"
license = { workspace = true }
publish = false

[dependencies]
astral-types = { path = "../astral-types" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# memory—v1: Use the workspace's locked SHA-256 backend for fixed-size trie branches.
ring = "0.17"
hex = { workspace = true }
im = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }
uuid = { workspace = true }

[features]
# memory—v1: Isolated-test hooks only (for example adopting a fixture root as
# Serving). Dev-dependency feature isolation under resolver 2 keeps it out of
# ordinary production builds, but explicit feature selection can enable it.
# This feature is not a security boundary and must not be used for deployment.
test-support = []

[[bench]]
name = "memory_v1_candidate"
harness = false
