[package]
name = "astral-chat"
version = "0.1.0"
edition = "2021"
description = "AstralLight 即时通讯服务"
license = "AGPL-3.0-or-later"

[[bin]]
name = "astral-chat"
path = "src/main.rs"

[dependencies]
astral-common = { path = "../astral-common" }
astral-types = { path = "../astral-types" }

axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tower-http = { workspace = true }
futures-util = "0.3"
uuid = { workspace = true }
tokio-stream = "0.1"
astral-db = { path = "../astral-db" }
policy-engine = { path = "../policy-engine" }
sqlx = { workspace = true }
jsonwebtoken = { workspace = true }
astral-mq = { path = "../astral-mq" }
lapin = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }