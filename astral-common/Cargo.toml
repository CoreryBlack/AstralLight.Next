[package]
name = "astral-common"
version = "0.1.0"
edition = "2021"
description = "AstralLight 公共基础设施（配置、错误、中间件）"
license.workspace = true

[features]
e3-observability = []
e4-observability = []
# Redis 编译层退役 marker（default-off，零依赖）：由各 runtime 的 redis-compat
# feature 传播。config 启动期集中校验用它区分"compat 旗标开启但二进制未编译
# redis-compat"的 fail-closed 拒绝场景（redis-layer-retirement-20261002）。
redis-compat = []

[dependencies]
astral-types = { path = "../astral-types" }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
config = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
jsonwebtoken = { workspace = true }
futures-util = "0.3"
policy-engine = { path = "../policy-engine" }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
