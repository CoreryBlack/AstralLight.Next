[package]
name = "astral-db"
version = "0.1.0"
edition = "2021"
description = "AstralLight 数据库访问层 — RuleRepository sqlx 实现"
license.workspace = true

[features]
test-support = []
# Redis 编译层退役（redis-layer-retirement-20261002）：默认构建零 redis 编译
# 链接；compat 适配路径（L2 evidence、perm:card:* 缓存、资格缓存、连接池、
# 共享 cache epoch）统一收敛到本显式 feature（default-off）。
redis-compat = ["dep:redis"]
e1-observability = ["policy-engine/e1-observability"]
e3-observability = ["astral-common/e3-observability"]
e4-observability = ["astral-common/e4-observability"]

[dependencies]
policy-engine = { path = "../policy-engine" }
astral-types = { path = "../astral-types" }
astral-common = { path = "../astral-common" }

sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
tokio = { workspace = true }
moka = { workspace = true }
async-trait = "0.1"
redis = { workspace = true, optional = true }
time = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
astral-common = { path = "../astral-common" }

# 真 Redis 集成测试仅在显式 redis-compat feature 下编译（环境门禁语义不变：
# 未设置 REDIS_URL 时测试内部显式 [SKIP]，不得由 exit 0 折算 PASS）。
[[test]]
name = "evidence_cache_redis_integration"
required-features = ["redis-compat"]
