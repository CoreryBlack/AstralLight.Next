[package]
name = "astral-identity"
version = "0.1.0"
edition = "2021"
description = "AstralLight 身份认证服务 — 登录/注册/JWT 签发"
license.workspace = true

[[bin]]
name = "astral-identity"
path = "src/main.rs"

[dependencies]
astral-common = { path = "../astral-common" }
astral-types = { path = "../astral-types" }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
config = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
garde = { workspace = true }
uuid = { workspace = true }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
astral-db = { path = "../astral-db" }
policy-engine = { path = "../policy-engine" }
astral-mq = { path = "../astral-mq" }
lapin = { workspace = true }
sqlx = { workspace = true }
bcrypt = "0.16"
md-5 = "0.10"
sha2 = { workspace = true }
hex = { workspace = true }
redis = { workspace = true }
once_cell = "1"
totp-rs = "5"
aes-gcm = "0.10"
aes = "0.8"
base32 = "0.5"
base64 = "0.22"
reqwest = { workspace = true }
urlencoding = "2"

[dev-dependencies]
sqlx = { workspace = true }
tokio = { workspace = true, features = ["full"] }
