[package]
name = "astral-monitor"
version = "0.1.0"
edition = "2021"
description = "AstralLight 监控与告警服务"
license.workspace = true

[[bin]]
name = "astral-monitor"
path = "src/main.rs"

# Redis 编译层退役（redis-layer-retirement-20261002）：默认构建零 redis 编译
# 链接；compat 旗标开启 + feature 缺失由 astral-common 启动期集中校验拒绝。
# Redis 指标采集/健康探测的 compat 路径收敛到本显式 feature（default-off），
# 并传播 astral-common 的同名 marker feature。
[features]
redis-compat = ["dep:redis", "astral-common/redis-compat"]

[dependencies]
astral-common = { path = "../astral-common" }
astral-types = { path = "../astral-types" }

axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
redis = { workspace = true, optional = true }
sysinfo = { workspace = true }
async-trait = "0.1"
astral-db = { path = "../astral-db" }
policy-engine = { path = "../policy-engine" }

[dev-dependencies]
sqlx = { workspace = true }
tokio = { workspace = true, features = ["full"] }
time = { workspace = true }
