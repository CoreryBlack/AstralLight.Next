[package]
name = "astral-mq"
version = "0.1.0"
edition = "2021"
description = "AstralLight 消息队列层 — RabbitMQ Producer/Consumer + DLX + 幂等"
license.workspace = true

[dependencies]
astral-types = { path = "../astral-types" }
astral-db = { path = "../astral-db" }
astral-common = { path = "../astral-common" }

lapin = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
futures-util = "0.3"
async-trait = "0.1"
sqlx = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
hyper = { version = "1", features = ["http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"

[dev-dependencies]
astral-db = { path = "../astral-db", features = ["test-support"] }
