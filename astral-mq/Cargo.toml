[package]
name = "astral-mq"
version = "0.1.0"
edition = "2021"
description = "AstralLight 消息队列层 — RabbitMQ Producer/Consumer + DLX + 幂等"
license.workspace = true

[dependencies]
astral-types = { path = "../astral-types" }
astral-db = { path = "../astral-db" }
astral-common = { path = "../astral-common" }

lapin = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
futures-util = "0.3"
async-trait = "0.1"
# Redis 编译层退役（redis-layer-retirement-20261002）：durable DB 幂等
# （init_idempotency_db）是默认要求；redis 幂等 compat 路径
# （init_idempotency_redis）与会话撤销投影注入（set_session_revocation_redis）
# 收敛到本显式 feature（default-off）。
redis = { workspace = true, optional = true }
sqlx = { workspace = true }

[features]
redis-compat = ["dep:redis"]

# check_redis 诊断示例仅在显式 redis-compat feature 下编译。
[[example]]
name = "check_redis"
required-features = ["redis-compat"]