[package]
name = "astral-sdk"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Bounded Ed25519 authorization SDK client for AstralLight integrations"

[dependencies]
astral-sdk-contracts = { path = "../astral-sdk-contracts" }
ed25519-dalek = "2.2.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"
zeroize = "1.9.0"

[dev-dependencies]
http = "1.5.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
