[package]
name = "astral-single-node"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

description = "AstralLight single-node composite runtime"

[dependencies]
astral-authorization-root = { path = "../astral-authorization-root" }
astral-common = { path = "../astral-common" }
axum = { workspace = true }
astral-db = { path = "../astral-db" }
astral-gateway = { path = "../astral-gateway" }
astral-identity = { path = "../astral-identity" }
astral-mq = { path = "../astral-mq" }
astral-trustgraph = { path = "../astral-trustgraph" }
astral-types = { path = "../astral-types" }
hex = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
policy-engine = { path = "../policy-engine" }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
metrics-exporter-prometheus = { workspace = true }
# memory—v1: the isolated full-path test adopts a fixture root through the
# root's `test-support` hook. Resolver 2 isolates this dev dependency from
# ordinary production builds, not explicitly selected feature sets.
astral-authorization-root = { path = "../astral-authorization-root", features = ["test-support"] }
astral-trustgraph = { path = "../astral-trustgraph", features = ["test-support"] }
astral-types = { path = "../astral-types" }
async-trait = "0.1"
reqwest = { workspace = true }
url = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true }

# memory—v1: the SIGTERM scenario sends its signal with libc::kill(2) on Unix only.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
