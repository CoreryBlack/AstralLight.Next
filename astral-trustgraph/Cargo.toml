[package]
name = "astral-trustgraph"
version = "0.1.0"
edition = "2021"
description = "AstralLight 权限治理中心 — 策略管理/规则集/审批"
license.workspace = true

[features]
# Redis 编译层退役（redis-layer-retirement-20261002）：默认构建零 redis 编译
# 链接；`delete_redis_keys` eviction compat 路径收敛到本显式 feature
# （default-off），并传播 astral-common 的同名 marker feature。
redis-compat = ["dep:redis", "astral-common/redis-compat"]
e1-observability = [
    "astral-db/e1-observability",
    "policy-engine/e1-observability",
]
e3-observability = [
    "astral-common/e3-observability",
    "astral-db/e3-observability",
]
e4-observability = [
    "astral-common/e4-observability",
    "astral-db/e4-observability",
]

[[bin]]
name = "astral-trustgraph"
path = "src/main.rs"

[dependencies]
astral-common = { path = "../astral-common" }
astral-types = { path = "../astral-types" }
policy-engine = { path = "../policy-engine" }
astral-db = { path = "../astral-db" }
astral-sdk-contracts = { path = "../astral-sdk-contracts" }
ed25519-dalek = { workspace = true }
hex = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
redis = { workspace = true, optional = true }
astral-mq = { path = "../astral-mq" }
lapin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
time = { workspace = true }
futures-util = "0.3"
thiserror = { workspace = true }
anyhow = { workspace = true }
tower-http = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
async-trait = "0.1"
once_cell = "1"
uuid = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["full"] }
astral-db = { path = "../astral-db", features = ["test-support"] }
futures-util = "0.3"
metrics-exporter-prometheus = { workspace = true }

# 真 Redis 集成测试仅在显式 redis-compat feature 下编译。
[[test]]
name = "audit_replay_integration"
required-features = ["redis-compat"]
