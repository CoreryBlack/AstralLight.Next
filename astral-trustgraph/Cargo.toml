[package]
name = "astral-trustgraph"
version = "0.1.0"
edition = "2021"
description = "AstralLight 权限治理中心 — 策略管理/规则集/审批"
license.workspace = true

[features]
e1-observability = [
    "astral-db/e1-observability",
    "policy-engine/e1-observability",
]
e3-observability = [
    "astral-common/e3-observability",
    "astral-db/e3-observability",
]
e4-observability = [
    "astral-common/e4-observability",
    "astral-db/e4-observability",
]

[[bin]]
name = "astral-trustgraph"
path = "src/main.rs"

[dependencies]
astral-common = { path = "../astral-common" }
astral-types = { path = "../astral-types" }
policy-engine = { path = "../policy-engine" }
astral-db = { path = "../astral-db" }

axum = { workspace = true }
tokio = { workspace = true }
redis = { workspace = true }
astral-mq = { path = "../astral-mq" }
lapin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tower-http = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
async-trait = "0.1"
once_cell = "1"
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
astral-db = { path = "../astral-db", features = ["test-support"] }
futures-util = "0.3"
metrics-exporter-prometheus = { workspace = true }
