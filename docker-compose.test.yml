# AstralLight Rust isolated test environment.
# Default profile: MySQL only (single-node Redis-free path).
# Optional profiles: rabbit, redis-compat.
#
# Default start:
#   MYSQL_ROOT_PASSWORD=... DATABASE_URL=... \
#     docker compose -f docker-compose.test.yml up -d --wait
# Rabbit transport:
#   docker compose --profile rabbit -f docker-compose.test.yml up -d --wait
# Redis compatibility:
#   docker compose --profile redis-compat -f docker-compose.test.yml up -d --wait

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-astral_test}
    ports:
      - "127.0.0.1:3308:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    # The platform-v4 schema is the integration-test baseline. Rust-owned
    # incremental DDL is applied explicitly by astral-migrate.
    volumes:
      - ./Docs/sql/full_schema_v4.sql:/docker-entrypoint-initdb.d/00-platform-v4.sql:ro
      # The adopted Java-era history includes MFA, absent from the v4 dump.
      - ./astral-db/migrations/20240630000012_user_mfa.sql:/docker-entrypoint-initdb.d/01-mfa-baseline.sql:ro

  redis:
    profiles: ["redis-compat"]
    image: redis:7
    ports:
      - "127.0.0.1:6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    profiles: ["rabbit"]
    image: rabbitmq:3-management
    environment:
      # Inactive profiles still interpolate; the runner validates these for --rabbit.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 10
