name: ${TDSC_COMPOSE_PROJECT:?}

services:
  mysql:
    image: ${TDSC_MYSQL_IMAGE:?}
    environment:
      MYSQL_DATABASE: ${TDSC_DB_NAME:?}
      MYSQL_USER: ${TDSC_DB_USERNAME:?}
      MYSQL_PASSWORD: ${TDSC_DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${TDSC_DB_ROOT_PASSWORD:?}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ${TDSC_SCHEMA_INIT_DIR:?}/00-full-schema.sql:/docker-entrypoint-initdb.d/00-full-schema.sql:ro
      - ${TDSC_SCHEMA_INIT_DIR:?}/10-session-resilience.sql:/docker-entrypoint-initdb.d/10-session-resilience.sql:ro
    networks:
      - tdsc
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    cpuset: ${TDSC_SERVICE_CPUSET:?}
    mem_limit: ${TDSC_MYSQL_MEMORY_LIMIT:?}

  redis:
    image: ${TDSC_REDIS_IMAGE:?}
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
    networks:
      - tdsc
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 30
    cpuset: ${TDSC_SERVICE_CPUSET:?}
    mem_limit: ${TDSC_REDIS_MEMORY_LIMIT:?}

  rabbitmq:
    image: ${TDSC_RABBITMQ_IMAGE:?}
    environment:
      RABBITMQ_DEFAULT_USER: ${TDSC_RABBITMQ_USERNAME:?}
      RABBITMQ_DEFAULT_PASS: ${TDSC_RABBITMQ_PASSWORD:?}
    networks:
      - tdsc
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 30
    cpuset: ${TDSC_SERVICE_CPUSET:?}
    mem_limit: ${TDSC_RABBITMQ_MEMORY_LIMIT:?}

  identity:
    image: ${TDSC_IDENTITY_IMAGE:?}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: &service-environment
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${TDSC_DB_NAME:?}
      DB_USERNAME: ${TDSC_DB_USERNAME:?}
      DB_PASSWORD: ${TDSC_DB_PASSWORD:?}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MAIN_URL: jdbc:mysql://mysql:3306/${TDSC_DB_NAME:?}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MAIN_USERNAME: ${TDSC_DB_USERNAME:?}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MAIN_PASSWORD: ${TDSC_DB_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ""
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USERNAME: ${TDSC_RABBITMQ_USERNAME:?}
      RABBIT_PASSWORD: ${TDSC_RABBITMQ_PASSWORD:?}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${TDSC_RABBITMQ_USERNAME:?}
      SPRING_RABBITMQ_PASSWORD: ${TDSC_RABBITMQ_PASSWORD:?}
      JWT_SECRET: ${TDSC_JWT_SECRET:?}
      SPRING_JWT_SECRET: ${TDSC_JWT_SECRET:?}
      SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"
      SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "false"
      SPRING_CLOUD_NACOS_DISCOVERY_REGISTER_ENABLED: "false"
      APP_IDENTITY_SESSION_GRANT_CLAIMS_MODE: REQUIRE
      APP_IDENTITY_SESSION_RESILIENCE_ENABLED: "true"
      APP_IDENTITY_SESSION_RESILIENCE_PROJECTION_JOB_ENABLED: "${TDSC_IDENTITY_PROJECTION_JOB_ENABLED:-true}"
      APP_IDENTITY_SESSION_RESILIENCE_PROJECTION_INLINE_ENABLED: "${TDSC_IDENTITY_PROJECTION_INLINE_ENABLED:-true}"
      APP_IDENTITY_SESSION_RESILIENCE_RESPONSE_AES_GCM_KEY: ${TDSC_SESSION_RESPONSE_AES_GCM_KEY:?}
      APP_IDENTITY_SESSION_RESILIENCE_PROJECTION_FIXED_DELAY_MS: "500"
    networks:
      - tdsc
    cpuset: ${TDSC_SERVICE_CPUSET:?}
    mem_limit: ${TDSC_IDENTITY_MEMORY_LIMIT:?}

  identity-worker-a:
    image: ${TDSC_IDENTITY_IMAGE:?}
    profiles: ["multi-node"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVER_PORT: "9004"
      SPRING_PROFILES_ACTIVE: tdsc-fault
      APP_IDENTITY_SESSION_RESILIENCE_PROJECTION_JOB_ENABLED: "true"
      APP_IDENTITY_SESSION_RESILIENCE_PROJECTION_INLINE_ENABLED: "false"
      APP_IDENTITY_SESSION_RESILIENCE_WORKER_ID: identity-worker-a
      APP_IDENTITY_SESSION_RESILIENCE_OUTBOX_LEASE_SECONDS: ${TDSC_WORKER_LEASE_SECONDS:-2}
      APP_IDENTITY_SESSION_RESILIENCE_PROJECTION_FIXED_DELAY_MS: ${TDSC_WORKER_A_PROJECTION_DELAY_MS:-25}
      APP_IDENTITY_SESSION_RESILIENCE_EXPERIMENTAL_POST_CLAIM_GATE_ENABLED: "true"
      APP_IDENTITY_SESSION_RESILIENCE_EXPERIMENTAL_POST_CLAIM_GATE_NONCE: ${TDSC_POST_CLAIM_GATE_NONCE:-}
      APP_IDENTITY_SESSION_RESILIENCE_EXPERIMENTAL_POST_CLAIM_GATE_WAIT_TIMEOUT_MS: ${TDSC_POST_CLAIM_GATE_WAIT_TIMEOUT_MS:-30000}
    networks:
      - tdsc
    cpuset: ${TDSC_SERVICE_CPUSET:?}
    mem_limit: ${TDSC_IDENTITY_MEMORY_LIMIT:?}

  identity-worker-b:
    image: ${TDSC_IDENTITY_IMAGE:?}
    profiles: ["lease-worker-b"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVER_PORT: "9004"
      APP_IDENTITY_SESSION_RESILIENCE_PROJECTION_JOB_ENABLED: "true"
      APP_IDENTITY_SESSION_RESILIENCE_PROJECTION_INLINE_ENABLED: "false"
      APP_IDENTITY_SESSION_RESILIENCE_WORKER_ID: identity-worker-b
      APP_IDENTITY_SESSION_RESILIENCE_OUTBOX_LEASE_SECONDS: ${TDSC_WORKER_LEASE_SECONDS:-2}
      APP_IDENTITY_SESSION_RESILIENCE_PROJECTION_FIXED_DELAY_MS: ${TDSC_WORKER_B_PROJECTION_DELAY_MS:-250}
    networks:
      - tdsc
    cpuset: ${TDSC_SERVICE_CPUSET:?}
    mem_limit: ${TDSC_IDENTITY_MEMORY_LIMIT:?}

  trustgraph:
    image: ${TDSC_TRUSTGRAPH_IMAGE:?}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${TDSC_DB_NAME:?}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: ${TDSC_DB_USERNAME:?}
      SPRING_DATASOURCE_PASSWORD: ${TDSC_DB_PASSWORD:?}
      DYNAMIC_DATASOURCE_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/${TDSC_DB_NAME:?}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
      DYNAMIC_DATASOURCE_DATASOURCE_MASTER_USERNAME: ${TDSC_DB_USERNAME:?}
      DYNAMIC_DATASOURCE_DATASOURCE_MASTER_PASSWORD: ${TDSC_DB_PASSWORD:?}
      APP_TRUST_SESSION_GRANT_CLAIMS_MODE: REQUIRE
    networks:
      - tdsc
    cpuset: ${TDSC_SERVICE_CPUSET:?}
    mem_limit: ${TDSC_TRUSTGRAPH_MEMORY_LIMIT:?}

  learn:
    image: ${TDSC_LEARN_IMAGE:?}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_started
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MAIN_URL: jdbc:mysql://mysql:3306/${TDSC_DB_NAME:?}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MAIN_USERNAME: ${TDSC_DB_USERNAME:?}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MAIN_PASSWORD: ${TDSC_DB_PASSWORD:?}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_DUO_URL: jdbc:mysql://mysql:3306/${TDSC_DB_NAME:?}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_DUO_USERNAME: ${TDSC_DB_USERNAME:?}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_DUO_PASSWORD: ${TDSC_DB_PASSWORD:?}
      APP_IDENTITY_BASE_URL: http://identity:9004
    networks:
      - tdsc
    cpuset: ${TDSC_SERVICE_CPUSET:?}
    mem_limit: ${TDSC_LEARN_MEMORY_LIMIT:?}

  gateway:
    image: ${TDSC_GATEWAY_IMAGE:?}
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_started
      trustgraph:
        condition: service_started
      learn:
        condition: service_started
    environment:
      <<: *service-environment
      IDENTITY_SERVICE_URI: http://identity:9004
      TRUST_GRAPH_URI: http://trustgraph:9005
      LEARN_SERVICE_URI: http://learn:9002
      APP_GATEWAY_JWT_SECRET: ${TDSC_JWT_SECRET:?}
      APP_GATEWAY_AUTH_SESSION_GRANT_CLAIMS_MODE: REQUIRE
    networks:
      - tdsc
    cpuset: ${TDSC_SERVICE_CPUSET:?}
    mem_limit: ${TDSC_GATEWAY_MEMORY_LIMIT:?}

  protocol-runner:
    image: ${TDSC_PROTOCOL_RUNNER_IMAGE:?}
    profiles: ["workload"]
    depends_on:
      gateway:
        condition: service_started
    environment:
      GATEWAY_BASE_URL: http://gateway:9001
      TDSC_RUN_ID: ${TDSC_RUN_ID:?}
      TDSC_SEED: ${TDSC_SEED:?}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${TDSC_DB_NAME:?}
      DB_USERNAME: ${TDSC_DB_USERNAME:?}
      DB_PASSWORD: ${TDSC_DB_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TDSC_POST_CLAIM_GATE_NONCE: ${TDSC_POST_CLAIM_GATE_NONCE:-}
    volumes:
      - ./results/${TDSC_RUN_ID:?}:/evidence
    networks:
      - tdsc
    cpuset: ${TDSC_RUNNER_CPUSET:?}
    mem_limit: ${TDSC_RUNNER_MEMORY_LIMIT:?}

  opa:
    image: ${TDSC_OPA_IMAGE:?}
    profiles: ["comparison"]
    command: ["run", "--server", "--addr", ":8181", "--log-level", "error"]
    networks:
      - tdsc
    cpuset: ${TDSC_SERVICE_CPUSET:?}
    mem_limit: ${TDSC_OPA_MEMORY_LIMIT:?}

networks:
  tdsc:
    internal: true

volumes:
  mysql-data:
