[workspace]
members = ["learn", "chat", "test-support"]
resolver = "2"

[workspace.dependencies]
astral-sdk-contracts = { path = "../astral-sdk-contracts" }
astral-sdk = { path = "../astral-sdk" }
astral-sdk-axum = { path = "../astral-sdk-axum" }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
axum = "0.8"
