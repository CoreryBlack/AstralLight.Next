[package]
name = "policy-engine"
version = "0.1.0"
edition = "2021"
description = "AstralLight 权限策略评估引擎核心"
license.workspace = true

[dependencies]
astral-types = { path = "../astral-types" }
astral-authorization-root = { path = "../astral-authorization-root" }

serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true, optional = true }
arc-swap = { workspace = true }
im = { workspace = true }
async-trait = "0.1"
iai-callgrind = { version = "0.14", optional = true }

[dev-dependencies]
# memory—v1: test-only adoption hooks; dev-dependency features never reach a
# production build under resolver 2.
astral-authorization-root = { path = "../astral-authorization-root", features = ["test-support"] }
metrics-exporter-prometheus = { workspace = true }
tokio = { workspace = true }
tokio-test = { workspace = true }
mockall = { workspace = true }
serde = { workspace = true }
criterion = { workspace = true }
divan = { workspace = true }

[features]
iai = ["dep:iai-callgrind"]
e1-observability = ["dep:uuid"]
performance-attribution = []

[[bench]]
name = "authorization_compiler_bench"
harness = false

[[bench]]
name = "authorization_compiler_alloc"
harness = false

[[bench]]
name = "authorization_compiler_iai"
harness = false
required-features = ["iai"]
