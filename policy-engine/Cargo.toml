[package]
name = "policy-engine"
version = "0.1.0"
edition = "2021"
description = "AstralLight 权限策略评估引擎核心"
license.workspace = true

[dependencies]
astral-types = { path = "../astral-types" }

serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true, optional = true }
arc-swap = { workspace = true }
im = { workspace = true }
async-trait = "0.1"
iai-callgrind = { version = "0.14", optional = true }

[dev-dependencies]
metrics-exporter-prometheus = { workspace = true }
tokio = { workspace = true }
tokio-test = { workspace = true }
mockall = { workspace = true }
serde = { workspace = true }
criterion = { workspace = true }
divan = { workspace = true }

[features]
# Legacy/test-only engine paths (L1/L2/fallback/CARD_ONLY). Native tests use
# strict published evidence; enable explicitly to run compatibility coverage.
legacy-tests = []
iai = ["dep:iai-callgrind"]
e1-observability = ["dep:uuid"]

[[bench]]
name = "policy_bench"
harness = false

[[bench]]
name = "tenant_isolation_bench"
harness = false

[[bench]]
name = "authorization_compiler_bench"
harness = false

[[bench]]
name = "authorization_compiler_alloc"
harness = false

[[bench]]
name = "authorization_compiler_iai"
harness = false
required-features = ["iai"]
