[package]
name = "test-harness"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[dependencies]
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
hmac = { workspace = true }
# Client-only authority adapter verifies the production mTLS owner path without
# compiling the authority service, signer, or etcd server features.
astral-authority = { path = "../astral-authority", default-features = false }
astral-types = { path = "../astral-types" }
tokio = { workspace = true }
# s15_probe_executor TLS transport: blocking client over the workspace
# rustls stack; GET-only, used exclusively by the s15-probe executor.
reqwest = { workspace = true, features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
