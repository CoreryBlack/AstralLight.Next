# Supplement the existing DarkStar-Papers entries in tests-suite/MANIFEST.toml.
# Arguments are interpreted by the Rust campaign, never by a shell.

[[case]]
id = "darkstar-rq3-five-arm-1"
darkstar_lane = "performance"
darkstar_evidence = "rq3-five-arm"
timeout_seconds = 3600
args = ["test", "--release", "-p", "policy-engine", "--lib", "--", "--ignored", "--exact", "memory_v1_formal::tests::abc_benchmark::ordinary_read_comparison", "--nocapture", "--test-threads=1"]
expected_tests = 126
boundary = "Release five-arm benchmark; six rounds and 125 isolated children, raw structured observations retained. Assertion-enabled builds run only a bounded smoke, not this performance measurement."

