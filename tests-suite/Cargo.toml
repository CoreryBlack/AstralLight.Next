[package]
name = "testsuite"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

# 分类测试套件 crate:集成测试按主系列物理存放于 tests-suite/series/<系列>/。
# 单元测试(#[cfg(test)] 内联)按 Cargo 语义留在属主 crate,由 MANIFEST 编目。

[dependencies]
astral-types = { path = "../astral-types" }
astral-common = { path = "../astral-common" }
astral-db = { path = "../astral-db" }
astral-mq = { path = "../astral-mq" }
astral-gateway = { path = "../astral-gateway" }
astral-identity = { path = "../astral-identity" }
astral-monitor = { path = "../astral-monitor" }
policy-engine = { path = "../policy-engine" }
astral-trustgraph = { path = "../astral-trustgraph" }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
sha2 = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
time = { workspace = true }
hmac = { workspace = true }
moka = { workspace = true }
lapin = { workspace = true }
futures-util = "0.3"
redis = { workspace = true, optional = true }

[features]
default = ["astral-db/test-support"]
# 按需兼容验证入口:cargo test -p testsuite --features redis-compat
redis-compat = [
    "dep:redis",
    "astral-db/redis-compat",
    "astral-common/redis-compat",
    "astral-gateway/redis-compat",
    "astral-identity/redis-compat",
    "astral-trustgraph/redis-compat",
    "astral-mq/redis-compat",
]

# Cargo 不会自动发现 series/<系列>/ 下的测试文件,全部目标显式登记。
[[test]]
name = "db_integration"
path = "series/CORE/db_integration.rs"

