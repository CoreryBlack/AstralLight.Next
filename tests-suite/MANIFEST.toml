# Executable index. SERVICE dependency equality is enforced before dispatch.
# A series label is coverage attribution, never a claim that a full campaign ran.
# Native kernel fixtures do not materialize MySQL state or prove host mediation.

[[profile]]
id = "native-kernel"
production_services = []
deployment = "native-single-node component checks"
boundary = "in-process component assertions; no durable or HTTP integration"

[[profile]]
id = "offline-validation"
production_services = []
deployment = "offline abstract protocol tooling"
boundary = "Python standard library; no runtime authorization proof"

[[profile]]
id = "native-single-node"
production_services = ["mysql"]
deployment = "MySQL + LocalBus + LocalProjectionBus + MemoryProjectionHub"
boundary = "existing approved isolated database only; no RabbitMQ/Redis/OPA"

[[profile]]
id = "standalone-rabbit"
production_services = ["mysql", "rabbitmq"]
deployment = "standalone services using Rabbit transport"
boundary = "explicit Rabbit vhost and MySQL durable consumer proof; no Redis"

[[profile]]
id = "distributed"
production_services = ["mysql", "rabbitmq"]
deployment = "current multi-process Rabbit transport"
boundary = "full current campaign blocked until legacy Redis/OPA harness is replaced and deployment is approved"

[[profile]]
id = "redis-compat"
production_services = ["mysql", "redis"]
deployment = "explicit redis-compat feature/runtime adapter window"
boundary = "compat-only; never a native default; registered sunset 2026-12-31"

[[profile]]
id = "performance-kernel"
production_services = []
deployment = "production compiler/policy/hub CPU components"
boundary = "CPU/allocation measurements only; not HTTP/MySQL/multi-node performance"

[[profile]]
id = "performance-native"
production_services = ["mysql"]
deployment = "native composite with signed HTTP loadgen"
boundary = "requires approved isolated deployed binary, signed identity and durable convergence"

[[series]]
id = "CORE"
boundary = "workspace/static/component verification; ignored and excluded checks retain separate status"
[[series]]
id = "RQ1"
boundary = "component authorization baseline; complete comparative/live research campaign remains separate"
[[series]]
id = "RQ2"
boundary = "compiler/tenant scaling components; historical RQ2-K/I live campaign separate; RQ2-D structurally N/A"
[[series]]
id = "RQ3"
boundary = "incremental compiler/source/publication components; complete distributed write campaign separate"
[[series]]
id = "RQ4"
boundary = "recovery/churn/queue components; full write storm and cross-node convergence not established locally"
[[series]]
id = "RQ5"
boundary = "strict read/hub concurrency components; full warm/cold HTTP read campaign separate"
[[series]]
id = "M1"
boundary = "authorization assumption: source capture; not architecture delivery milestone M1"
[[series]]
id = "M2"
boundary = "authorization assumption: monotone publication; not universal multi-writer proof"
[[series]]
id = "M3"
boundary = "authorization assumption: faithful representation; bounded implementation assertions"
[[series]]
id = "M4"
boundary = "authorization assumption: trusted storage/processes; non-Byzantine premise remains explicit"
[[series]]
id = "M5"
boundary = "authorization assumption: complete mediation; local tests do not prove all deployed host operations"
[[series]]
id = "E1"
boundary = "full decision-path race protocol; local wiring is not a live signed-host race result"
[[series]]
id = "E2"
boundary = "five stable controlled omission tests; host_mediation remains model-only"
[[series]]
id = "E3"
boundary = "recovery-tail protocol; offline observations and native lifecycle distinguish live fault campaign"
[[series]]
id = "E4"
boundary = "profile-specific fault prerequisites and fail-closed checks; no live controller is implied by a plan"
[[series]]
id = "E5"
boundary = "bounded abstract models and implementation comparison; no unbounded/deployment proof"
[[series]]
id = "MT-E1"
boundary = "multi-tenant strict scope isolation; distinct from authorization E1"
[[series]]
id = "MT-E2"
boundary = "no implementation or registered target exists; explicitly BLOCKED"
[[series]]
id = "MT-E3"
boundary = "generation churn and revocation/restore"
[[series]]
id = "MT-E4"
boundary = "cross-tenant invalidation storm; distinct from authorization E4"
[[series]]
id = "MT-E5"
boundary = "bounded tenant/card capacity; not authorization E5 model"
[[series]]
id = "MT-E6"
boundary = "fail-closed injection contracts"
[[series]]
id = "PERF"
boundary = "measured component versus real deployed performance; environment and source snapshot required"
[[series]]
id = "COMPAT"
boundary = "explicit retired/compatibility semantics; not native current deployment acceptance"
[[series]]
id = "EXCLUDED"
boundary = "outside root workspace; dedicated compile/integration paths only"

[[suite]]
id = "campaign-contracts"
owner = "scripts"
profile = "native-kernel"
test_services = []
series = ["CORE", "M4", "E4"]
scope = "component"
boundary = "runner/manifest assertions and stub subprocesses only; no DB, Docker or live fault"
sources = ["scripts/test_campaign.py", "scripts/performance_acceptance.py", "Docs/authorization-validation/tools/model_acceptance.py", "scripts/tests", "tests-suite/MANIFEST.toml"]
argv = ["python", "-B", "-m", "unittest", "discover", "-s", "scripts/tests", "-p", "test_*.py"]
acceptance = "unittest"
minimum_tests = 20

[[suite]]
id = "shell-runner-contracts"
owner = "scripts"
profile = "native-kernel"
test_services = []
series = ["CORE", "E4"]
scope = "component"
boundary = "mock Cargo/Docker orchestration only; no integration proof"
sources = ["scripts/tests/test-run-tests.sh", "scripts/run-tests.sh"]
argv = ["bash", "scripts/tests/test-run-tests.sh"]
acceptance = "command"
required_output = "runner contracts: entrypoints passed"

[[suite]]
id = "workspace-check"
owner = "workspace"
profile = "native-kernel"
test_services = []
series = ["CORE"]
scope = "component"
boundary = "current workspace members compile; excluded crates separate"
sources = ["Cargo.toml", "Cargo.lock"]
argv = ["cargo", "check", "--workspace", "--locked"]
acceptance = "command"
timeout_seconds = 1800

[[suite]]
id = "workspace-clippy"
owner = "workspace"
profile = "native-kernel"
test_services = []
series = ["CORE"]
scope = "component"
